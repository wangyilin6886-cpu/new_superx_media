<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperX Studio</title>
<meta name="description" content="SuperX 创作工作台 · AI 短视频">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="canonical" href="https://superx-id.com/studio">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SUPERX INDO">
<meta property="og:url" content="https://superx-id.com/studio">
<meta property="og:title" content="SuperX Studio · 创作工作台">
<meta property="og:description" content="四条产品线共用的创作工作台：对话生成，右侧实时看产出。">
<meta property="og:image" content="https://superx-id.com/assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#07070A">
<link rel="stylesheet" href="assets/css/studio.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='6' y='6' width='20' height='20' rx='5' transform='rotate(45 16 16)' fill='%230B62CE'/></svg>">
<script src="assets/js/i18n-dict.js"></script>
<script src="assets/js/i18n.js"></script>
</head>
<body data-mode="video">

<div class="scrim" id="scrim"></div>

<div class="app">

  <!-- ============ 左栏 ============ -->
  <aside class="nav" id="nav">
    <div class="nav-head">
      <a href="index.html" class="logo"><img src="assets/img/logo.png" alt="SUPERX INDO"></a>
      <div style="flex:1"></div>
      <button class="icon-btn" id="navToggle" aria-label="折叠侧栏" title="折叠侧栏">⊟</button>
    </div>

    <div class="nav-body">
      <button class="new-chat" id="newChat">
        <span style="color:var(--accent)">✦</span> 新建创作
        <span class="caret">▾</span>
      </button>
      <div class="mode-menu" id="modeMenu">
        <button data-mode="video"><i class="dot" style="background:#FF5A6E"></i><span>AI 短视频<span class="sub">批量出片</span></span></button>
        <button data-mode="drama"><i class="dot" style="background:#A855F7"></i><span>AI 短剧<span class="sub">剧本到成片</span></span></button>
        <button data-mode="education"><i class="dot" style="background:#34D399"></i><span>AI 教育<span class="sub">课件 + 讲课视频</span></span></button>
        <button data-mode="app"><i class="dot" style="background:#F59E0B"></i><span>AI App<span class="sub">Vibe Coding</span></span></button>
      </div>

      <div id="navTree"></div>

      <div style="margin-top:18px">
        <a class="back-site" href="index.html">← 返回官网</a>
        <div data-lang-switch style="margin-top:10px"></div>
      </div>
    </div>

    <div class="nav-foot" id="navFoot"></div>

  </aside>

  <!-- ============ 中栏 ============ -->
  <main class="main">
    <header class="top">
      <button class="icon-btn hide-lg" id="navOpen" aria-label="菜单" style="display:none">☰</button>
      <span class="mode-dot"></span>
      <span class="title" id="chatTitle">冬季新品投放</span>
      <button class="icon-btn" style="width:24px;height:24px;font-size:12px" title="重命名">✎</button>
      <span class="env-badge hide-sm" id="envBadge" hidden></span>
      <span class="spacer"></span>
      <span class="credits hide-sm"><span style="color:var(--accent)">⚡</span> <b>128</b> 额度</span>
      <button class="top-btn hide-sm">↗ 分享</button>
      <button class="top-btn" id="sideToggle" title="显示/隐藏工作台">⊞<span class="lb"> 工作台</span></button>
    </header>

    <div class="thread" id="thread">
      <!-- 空状态 -->
      <div class="empty" id="empty">
        <div class="dot-title"><i></i></div>
        <div id="emptyBody"></div>
      </div>

      <!-- 对话流由 JS 注入 -->
      <div class="thread-inner" id="threadInner" hidden></div>
    </div>

    <div class="composer-wrap">
      <div class="params" id="params"></div>

      <div class="composer">
        <textarea id="input" rows="1" placeholder="告诉 SuperX 你要什么…"></textarea>
        <div class="chips" id="chips"></div>
        <div class="composer-bar">
          <button class="cbtn" id="addBtn">⊕<span class="lb"> 添加</span></button>
          <button class="cbtn" id="atBtn">@<span class="lb"> 引用</span></button>
          <button class="cbtn" id="paramBtn">🎛<span class="lb"> 参数</span></button>
          <span class="sp"></span>
          <span id="composerExtra"></span>
          <select class="mode-select" id="runMode" title="执行模式">
            <option value="step">逐步确认</option>
            <option value="auto">自动执行</option>
            <option value="plan">只出方案</option>
          </select>
          <button class="send" id="send" aria-label="发送">↑</button>
        </div>
      </div>
    </div>
  </main>

  <!-- ============ 右栏工作台 ============ -->
  <aside class="side" id="side">
    <div class="side-top">
      <div id="tabs" style="display:flex;gap:2px;min-width:0;overflow-x:auto"></div>
      <span class="sp"></span>
      <button class="icon-btn" id="gridToggle" title="网格 / 单条">⊞</button>
      <button class="icon-btn" id="sideClose" title="收起工作台">⊟</button>
    </div>

    <div class="side-body" id="sideBody"></div>

  </aside>

</div>

<button class="side-handle" id="sideOpen" title="展开工作台">◀</button>
<div class="toast" id="toast"></div>

<script src="assets/js/auth.js"></script>
<script src="assets/js/studio.js"></script>
</body>
</html>
